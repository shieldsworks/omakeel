[package]
name = "omakeel-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Parse and write omakeel socket messages"
license = "MIT"
repository = "https://github.com/shieldsworks/omakeel"
homepage = "https://omahoy.org"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
