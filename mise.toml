# `watch` is mise's file watcher, so the terminal client is `mise follow`.

[tools]
rust = { version = "1.98", profile = "minimal", components = "rustfmt,clippy" }

[tasks.build]
description = "Debug build"
run = "cargo build --locked"

[tasks.test]
description = "Unit tests and the socket test"
run = "cargo test --locked"

[tasks.lint]
description = "rustfmt check, clippy with warnings denied, and the comment ban"
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  "scripts/check-comments.sh",
]

[tasks.format]
description = "rustfmt, writing"
run = "cargo fmt"

[tasks.replay]
description = "Run the hub on the sample sail out of Berkeley Marina"
run = "cargo run --locked -- run --source replay:tests/fixtures/berkeley-marina.nmea"

[tasks.follow]
description = "Print the running hub's state as it changes (omakeel watch)"
run = "cargo run --locked -- watch"

[tasks.sample]
description = "Regenerate the synthetic sample sail"
run = "python3 scripts/sample-sail.py"
